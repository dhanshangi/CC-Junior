<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="../css/hash.css" />
  <link rel="stylesheet" type="text/css" href="../css/style.css" />
  <link rel="stylesheet" type="text/css"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
  <title>Level-1</title>
</head>

<body>
  <div class="pageGrid Prac_level center-y-all">
    <header>
      <!-- Navbar section -->
      <section id="h1">
        <div class="simpleGrid navbar" style="--grid: 3">
          <div class="inner-flex n0-i1 start-x-flex center-y-flex">
            <div class="inner n1-i1 nav-profile">
              <img src="../img/Profile_icon.png" alt="Profile img" />
            </div>
            <div class="inner n1-i2">
              <h1>
                Hi, <br />
                <span>Coder</span>
              </h1>
            </div>
          </div>
          <!-- CC-JR icon -->
          <div class="inner n0-i2 nav-title center-x-single center-y-single">
            <a href="https://hashhackcode.com/camp/ccjr/index.html"> 
              <img src="../img/Subject_icon.png" alt="CC-jr img" />
            </a>
            <!-- <img src="/img/CCjr logo.png" alt="CC-jr img" /> -->
          </div>
          <!-- nav icons -->
          <div class="inner-flex n0-i3 nav-icons center end-x-flex center-y-flex gp-md">
            <div class="inner n1-i1 menu-item">
              <a href="https://hashhackcode.com/camp/ccjr/index.html">
                <img src="../img/lessons.png" alt="Lesson icon" class="header-image" />
                <h2>Lessons</h2>
              </a>
            </div>
            <div class="inner n1-i2 menu-item">
              <a href="#" style="cursor: not-allowed;">
                <img src="../img/practices.png" alt="Practice icon" class="header-image" />
                <h2>Practices</h2>
              </a>
            </div>
            <div class="inner n1-i3 menu-item">
              <a href="#" style="cursor: not-allowed;">
                <img src="../img/skills.png" alt="Skill icon" class="header-image" />
                <h2>Skills</h2>
              </a>
            </div>
          </div>
        </div>
      </section>
    </header>
    <!-- Practice section for Level-1 -->
    <main>
      <section id="m1">
         <div class="inner-flex n0-i1 start-x-flex center-y-flex gp-xs level-navigation">
            <div class="inner n1-i1">
              <a href="https://hashhackcode.com/camp/ccjr/index.html">
                <img src="../img/prev_arrow.png" alt="Back-btn" class="prev-arrow" />
              </a>
            </div>
            <div class="inner n1-i2 center level-indicator boxsize">
              <h3>Practice 2</h3>
            </div>
          </div>

         <div class="inner-flex n0-i2 center-x-flex gp-sm center-y-flex mt-xs-single Prac_level-cards popup">
            <div class="inner n1-i1">
                <img src="../img/L1-L2-Pr-1.png" alt="">
            </div>
            <div class="inner n1-i2">
                <img src="../img/L1-L2-Pr-2.png" alt="">
            </div>
            <div class="inner n1-i3">
                <img src="../img/L1-L2-Pr-3.png" alt="">
            </div>
            <div class="inner n1-i4">
                <img src="../img/L1-L2-Pr-4.png" alt="">
            </div>
            <div class="inner n1-i5">
                <img src="../img/L1-L2-Pr-5.png" alt="">
            </div>
         </div>


           <!-- Popup -->
        <div id="practicePopup" class="practice-popup">
          <div class="popup-content">
            <img class="popup-img" id="popupImage" src="" alt="Popup Image">
            <span class="practice-close"></span>
          </div>
        </div>


      </section>
    </main>
  </div>

  <div class="inner mobile">
    <p>Please rotate your device.</p>
    <img src="../img/rotate.svg" alt="Icon representing rotation">
  </div>

  <script src="../js/common.js"></script>

  <script>
    const images = document.querySelectorAll('.inner img');
    const popup = document.getElementById('practice-popup');
    const popupImg = document.getElementById('popupImg');
    const closeBtn = document.getElementById('close-popup');
  
    images.forEach(img => {
      img.addEventListener('click', () => {
        popup.style.display = 'flex';
        popupImg.src = img.src;
      });
    });
  
    closeBtn.addEventListener('click', () => {
      popup.style.display = 'none';
    });
  </script>
  
</body>

</html>
