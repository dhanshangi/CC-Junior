<html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="./css/hash.css" />
  <link rel="stylesheet" type="text/css" href="./css/style.css" />
  <title>Home-page</title>

            </div>
          </div>

          <div class="inner n0-i2 nav-title center-x-single center-y-single">

          </div>
          <!-- nav icons -->
          <div class="inner-flex n0-i3 nav-icons center end-x-flex center-y-flex gp-md">

      <section id="m1">

        <div class="inner-flex n0-i1 flex-between center-y-flex gp-xs mt-xs-single Prac_level-cards">
          <a href="./Lessons/lesson1.html">

              <div class="inner n2-i1">

              <div class="inner n2-i2 p-md-single center center-x-single end-y-single practice-btn">

              </div>
            </div>
          </a>

          <a href="./Practice/practiceL1-1.html">

          <a href="./Lessons/lesson2.html">

              <div class="inner n2-i2 p-md-single center center-x-single end-y-single practice-btn">

              </div>
